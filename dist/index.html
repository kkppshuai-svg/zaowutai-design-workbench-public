<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>造物台 · 工业设计工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px "DM Sans","Microsoft YaHei",sans-serif;color:#222521;background:#f5f5f0}button,select,input,textarea,a{font:inherit}button,select,a.action{cursor:pointer}button,select,.action{border:1px solid #c8cbc4;background:#fafbf7;color:inherit;border-radius:5px;padding:8px 13px;text-decoration:none}button:hover,.action:hover{border-color:#666}header{background:#222721;color:#fff;display:flex;align-items:center;gap:14px;padding:15px 3.5vw}header b{font-size:21px;letter-spacing:2px}header span{font-size:13px;color:#c3c9bd}.logo{width:27px;height:27px;border:7px double #ff9256;transform:rotate(45deg)}header a{color:#fff;margin-left:auto;font-size:13px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 59px)}aside{padding:32px 18px;background:#e9ebe4;border-right:1px solid #ced1c9}label,.label{display:block;color:#535b51;font-size:12px;font-weight:650;letter-spacing:.07em;margin:0 0 10px}aside select{width:100%}aside>button{margin:10px 0 32px;width:100%}nav{display:grid;gap:6px}nav button{display:flex;align-items:center;gap:12px;text-align:left;border:0;background:transparent;padding:12px 10px}nav i{font:12px monospace;color:#677163}nav .on{background:#252c25;color:white}nav .on i{color:#ffad70}main{padding:28px 3.5vw 36px;min-width:0}.head,.toolbar,.caption{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:clamp(24px,3.2vw,43px);letter-spacing:-.05em;margin:0}h2{font-size:17px;margin:0}.head p{margin:7px 0 20px;color:#586151}.toolbar{border-top:1px solid #c6cbc2;padding:13px 0}.controls{display:flex;gap:7px;flex-wrap:wrap}.controls button{font-size:13px}.active{background:#fdd6b4}.stage{border:1px solid #bfc4b9;border-radius:8px;overflow:hidden;background:#e0e1da}.views{display:grid;align-items:stretch}.views.dual{grid-template-columns:1fr 1fr}.frame{position:relative;min-width:0;display:grid;place-items:center;text-align:center;background:#dbddd5}.frame+.frame{border-left:2px solid #f4f4ee}.frame img{display:block;width:100%;height:clamp(310px,48vh,580px);object-fit:contain;background:#d9dad4}.frame small{position:absolute;top:12px;left:12px;background:#222822e8;color:white;padding:5px 9px;border-radius:3px}.caption{padding:10px 15px;background:#fafbf7;font-size:14px}.caption a{color:#414d40}.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 0 14px}.tile{min-width:88px;padding:4px;text-align:left;background:white}.tile img{width:100%;height:48px;object-fit:cover;display:block;border-radius:2px}.tile span{display:block;font-size:11px;margin:4px}.tile.sel{outline:2px solid #dc783a;outline-offset:-2px}.lower{display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid #c6cbc2;padding-top:16px}textarea{width:100%;resize:vertical;min-height:69px;background:white;border:1px solid #c6cbc2;border-radius:5px;padding:10px}.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 5px 0 9px;vertical-align:middle;border:1px solid #aaa}.hint{line-height:1.6;color:#50594c;font-size:13px}.empty{padding:90px 20px}.error{color:#a43116}.filelink{margin:7px;display:inline-block}dialog{border:1px solid #ccc;border-radius:8px;padding:24px}dialog input{display:block;margin:12px 0;padding:9px;width:100%}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{padding:12px}aside select,aside>button{width:auto;margin:0 5px 8px 0}nav{display:flex;overflow:auto}nav button{white-space:nowrap}aside .label{display:none}main{padding:18px}.lower{grid-template-columns:1fr}header span{display:none}}
body{font-size:16px}.transfer{margin:0 0 24px;font-size:14px}.transfer summary{cursor:pointer}.transfer p{line-height:1.55}.tile span{font-size:12px}.tile{flex:0 0 105px}header a{text-underline-offset:4px}.views.dual .frame img{background:#cdd0c9}@media(max-width:600px){.views.dual{grid-template-columns:1fr}.views.dual .frame img{height:30vh}.transfer{margin:8px 0}} #ai{width:min(540px,94vw);max-height:90vh;color:#252b25}#ai::backdrop{background:#14191488}.aiTop{display:flex;align-items:center;justify-content:space-between}#aiFields{border:none;padding:0}#ai label{font-size:14px;margin:12px 0 4px}#ai input,#ai select{width:100%;margin:4px 0}#ai input[type=checkbox]{display:inline;width:auto}#aiStatus{font-size:14px;color:#53624e}#answer{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}#ask,#aiOpen{background:#28332a;color:white}</style>
<header><i class="logo"></i><b>造物台</b><span>工业设计工作台</span><a href="workflow.html" target="_blank">查看工作流</a></header>
<div class="layout"><aside><label for="projects">当前项目</label><select id="projects"></select><button id="create">＋ 新建项目</button><details class="transfer"><summary>项目迁移</summary><p>旧工作台先导出项目，再在这里导入。文件和笔记保存在当前浏览器。</p><button id="exportDesk">导出项目</button> <button id="importDesk">导入项目</button><input id="archive" type="file" accept=".json" hidden><p id="transferStatus" role="status"></p></details><p class="label">设计流程</p><nav id="nav"></nav></aside><main>
<div class="head"><div><h1 id="title"></h1><p id="subtitle"></p></div></div>
<div class="toolbar"><h2 id="heading"></h2><div class="controls"><button id="aiOpen">生成阶段成果</button><button id="compare">对照参考</button><button id="upload">＋ 添加文件</button></div></div>
<div class="stage"><div class="views" id="views"></div><div class="caption"><b id="assetName"></b><a id="open" target="_blank">查看原图</a></div></div>
<div class="strip" id="strip"></div>
<div class="lower"><section><label for="notes">阶段笔记</label><textarea id="notes" placeholder="记录造型决定、材质参数或待修细节"></textarea><small id="status" role="status"></small></section><section><p class="label">检查重点</p><div id="hint" class="hint"></div><p id="materials"></p></section></div>
<input id="files" type="file" multiple hidden>
</main></div>
<dialog id="editResult"><h2 id="editTitle"></h2><textarea aria-label="成果内容" id="editText" style="min-height:40vh;width:min(650px,72vw)"></textarea><div><button id="editSave">保存修改</button> <button id="editClose">关闭</button></div><p id="editStatus"></p></dialog><dialog id="ai" aria-labelledby="aiTitle"><div class="aiTop"><h2 id="aiTitle">阶段生成</h2><button id="aiClose">关闭</button></div>
<fieldset id="aiFields"><label>模型服务<select id="provider"><option value="https://openrouter.ai/api/v1">OpenRouter</option><option value="https://api.deepseek.com">DeepSeek</option><option value="https://api.openai.com/v1">OpenAI</option><option value="">自定义兼容服务</option></select></label>
<label>API 地址<input id="endpoint" value="https://openrouter.ai/api/v1" readonly></label>
<label>API Key<input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="仅在此页面使用"></label>
<button id="models">获取模型列表</button><label>选择模型<select id="model"><option value="">手动输入模型 ID</option></select></label><input id="manualModel" aria-label="模型 ID" placeholder="模型 ID">
<label id="outputMode" hidden>输出类型<select id="renderMode"><option value="scene">Blender 渲染脚本</option><option value="image">AI 效果图（需图像生成模型）</option></select></label><p id="taskInfo"></p><label>设计要求<textarea id="question" placeholder="例如：保留辐条折角，降低银边光泽。"></textarea></label>
<label><input type="checkbox" id="sendNotes"> 使用各阶段笔记及已生成的上游成果</label><label><input type="checkbox" id="sendImage"> 附上当前图片（需视觉模型）</label>
<button id="ask">生成并存入当前阶段</button></fieldset><p id="aiStatus" role="status"></p><div id="answer"></div></dialog><dialog id="dialog"><form id="form"><label for="newname">新项目名称</label><input id="newname" maxlength="80" required><button type="button" id="cancel">取消</button> <button>创建项目</button></form></dialog>
<script>
'use strict';
const el=id=>document.getElementById(id), node=(tag,txt)=>{const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;return n};
const stages=['设计灵感','工业设计图','Blender 建模','材质与灯光','效果渲染'];
const hints=['提取重复节奏、轮廓和表面起伏，记录要保留的特征。','对齐各视图的中心线。注明尺寸来源，估算值单独标记。','用白模检查剪影与开口，剖看内外圈接缝和厚度。','固定机位和曝光，用条形高光检查倒角、拉丝方向和粗糙度。','正视看比例，斜视看深度，掠射光特写看边缘连接。'];
const dir='assets/';
const imgs=['01_参考款_正视形状','02_参考款_四分之三视图','03_参考款_轮辋侧视','04_中心旋纹盖与分段圈','05_银色包边与内凹石墨面','06_黑色凹槽与金属交界','07_轮毂盖独立产品图'].map((n,i)=>({name:['正视形状','四分之三视图','轮辋侧视','中心旋纹盖','石墨内凹面','外缘材质交界','独立轮毂盖'][i],url:dir+n+'.png',kind:'image'}));
const ref={name:'轮毂概念参考板',url:'参考板.jpg',kind:'image'};
const seed={id:'wheel',name:'银边石墨轮毂盖',notes:['五组分叉辐条，宽肩收窄到中心。','参考板标注轮辋直径 508 mm、宽 228 mm。','外缘沿圆弧收口，中心盖独立分件。','银色面粗糙度 0.25–0.33；石墨面 0.35–0.45。','观察银边折光是否连续，黑槽是否保有深度。'],assets:[[ref],[ref,imgs[0],imgs[2]],[{name:'轮毂盖 Blender 工程',url:dir+'新参考图_银色包边石墨内凹_轮毂盖.blend',kind:'file'},imgs[0]],[...imgs.slice(3,6)],[imgs[1],imgs[0],imgs[2],...imgs.slice(3)]]};
let projects=[],p,step=4,item=0,dual=false,db,urls=[],writes=Promise.resolve();
function persist(){const copy=structuredClone(p);writes=writes.catch(()=>{}).then(()=>new Promise((ok,no)=>{const tx=db.transaction('projects','readwrite');tx.objectStore('projects').put(copy);tx.oncomplete=ok;tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error)}));return writes}
function save(){el('status').textContent='保存中…';return persist().then(()=>el('status').textContent='已保存到本机浏览器').catch(()=>el('status').textContent='保存失败，请检查浏览器存储空间')}
function url(a){if(!a.blob)return a.url;const u=URL.createObjectURL(a.blob);urls.push(u);return u}
function pick(i){item=i;draw()}
function draw(){el("aiOpen").textContent=["生成设计方案","生成设计图","生成建模脚本","生成材质灯光脚本","生成渲染成果"][step];urls.forEach(u=>URL.revokeObjectURL(u));urls=[];el('projects').replaceChildren(...projects.map(q=>new Option(q.name,q.id)));el('projects').value=p.id;el('title').textContent=p.name;el('subtitle').textContent=p.id==='wheel'?'轮毂盖设计  /  银色切削包边 · 哑光石墨内面':'工业设计项目';el('heading').textContent=stages[step];el('hint').textContent=hints[step];el('notes').value=p.notes[step]||'';el('nav').replaceChildren(...stages.map((name,i)=>{const b=node('button');b.append(node('i','0'+(i+1)),name);b.className=i===step?'on':'';b.onclick=()=>{step=i;item=0;dual=false;draw()};return b}));
const list=p.assets[step],a=list[item],r=p.assets[0].find(x=>x.kind==='image'),canCompare=!!(r&&a&&a.kind==='image'&&step!==0);el('compare').disabled=!canCompare;const show=dual&&canCompare;el('compare').classList.toggle('active',show);el('compare').textContent=show?'结束对照':'对照参考';el('views').className='views'+(show?' dual':'');el('views').replaceChildren();
function frame(asset,label){const f=node('div');f.className='frame';if(asset?.kind==='image'){const im=node('img');im.src=url(asset);im.alt=asset.name;f.append(im)}else{const box=node('div');box.className='empty';box.append(node('h2',asset?.name||'本阶段还没有文件'));if(asset){const l=node('a','下载文件');l.href=url(asset);l.download=asset.blob?asset.name:'';l.className='filelink';box.append(l);if(asset.name.startsWith('AI · ')&&/\.(md|py)$/.test(asset.name)){const edit=node('button','查看与编辑');edit.onclick=()=>editGenerated(asset);box.append(edit)}}f.append(box)}if(label)f.append(node('small',label));el('views').append(f)}
if(show)frame(r,'灵感参考');frame(a,show?'当前视图':'');el('assetName').textContent=a?.name||'待添加素材';el('open').hidden=a?.kind!=='image';if(a)el('open').href=url(a);
el('strip').replaceChildren(...list.map((x,i)=>{const b=node('button');b.className='tile'+(i===item?' sel':'');if(x.kind==='image'){const im=node('img');im.src=url(x);im.alt='';b.append(im)}b.append(node('span',x.name));b.onclick=()=>pick(i);return b}));
el('materials').replaceChildren();if(p.id==='wheel')for(const [color,name] of [['#c4c6c5','切削铝'],['#474943','石墨'],['#1c201e','哑黑']]){const s=node('i');s.className='sw';s.style.background=color;el('materials').append(s,node('small',name))}}
el('compare').onclick=()=>{dual=!dual;draw()};el('notes').oninput=()=>{p.notes[step]=el('notes').value;save()};el('projects').onchange=e=>{p=projects.find(q=>q.id===e.target.value);step=p.id==='wheel'?4:0;item=0;dual=false;el('status').textContent='';draw()};
el('upload').onclick=()=>el('files').click();el('files').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;const list=p.assets[step];item=list.length;for(const f of files)list.push({name:f.name,kind:f.type.startsWith('image/')?'image':'file',blob:f});el('files').value='';draw();await save()};
el('create').onclick=()=>el('dialog').showModal();el('cancel').onclick=()=>el('dialog').close();el('form').onsubmit=e=>{e.preventDefault();const name=el('newname').value.trim();if(!name)return;p={id:crypto.randomUUID(),name,notes:[],assets:stages.map(()=>[])};projects.push(p);step=0;item=0;dual=false;el('dialog').close();el('newname').value='';draw();save()};
const req=indexedDB.open('industrial-design-desk-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('projects',{keyPath:'id'});req.onerror=()=>{el('status').textContent='无法使用本机浏览器存储';projects=[seed];p=seed;draw()};req.onsuccess=()=>{db=req.result;const q=db.transaction('projects').objectStore('projects').getAll();q.onsuccess=()=>{projects=q.result;if(!projects.some(x=>x.id==='wheel'))projects.unshift(seed);p=projects.find(x=>x.id==='wheel');draw()}};
</script><script src="transfer.js"></script><script src="pipeline.js"></script><script src="models.js"></script></html>
